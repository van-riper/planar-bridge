[project]
name = "planar-bridge"
version = "0.1.0"
description = "Download and maintain a local library of high-resolution Magic: the Gathering card scans."
readme = "README.md"
requires-python = ">=3.13"
license = { file = "LICENSE" }
dependencies = [
    "colorama~=0.4",
    "httpx~=0.28",
]

[project.scripts]
planar-bridge = "planar_bridge.cli.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/planar_bridge"]

[dependency-groups]
dev = [
    "black>=24",
    "pylint>=3",
    "pytest>=8",
    "pytest-cov>=7",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.black]
line-length = 80

[tool.pylint.format]
max-line-length = 80
